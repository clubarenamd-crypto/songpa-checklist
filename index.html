<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>골프프렌드 송파점 업무분담 체크리스트</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
  :root{
    --blue1:#1e3c72;
    --blue2:#2a5298;
    --accent:#2563eb;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI','Malgun Gothic',sans-serif;
    background:linear-gradient(135deg,var(--blue1),var(--blue2));
    min-height:100vh;
    padding:24px 12px 60px;
  }
  .wrap{max-width:1200px;margin:0 auto;}
  .header{
    background:#fff;border-radius:16px;padding:24px;text-align:center;
    box-shadow:0 10px 30px rgba(0,0,0,.2);margin-bottom:20px;position:relative;
  }
  .logo{font-size:26px;font-weight:800;color:var(--blue1);letter-spacing:0;}
  .logo span{color:#f5a623;}
  .subtitle{color:#555;margin-top:6px;font-size:14px;}
  .admin-btn{
    position:absolute;top:16px;right:16px;background:var(--accent);color:#fff;border:none;
    border-radius:20px;padding:8px 14px;font-size:13px;cursor:pointer;
  }
  .admin-btn.active{background:#e11d48;}
  .progress-card{
    background:#fff;border-radius:16px;padding:20px 24px;margin-bottom:20px;
    box-shadow:0 10px 30px rgba(0,0,0,.15);
  }
  .progress-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:10px;}
  .progress-percent{font-size:32px;font-weight:800;color:var(--blue1);}
  .progress-date{font-size:13px;color:#888;}
  .progress-bar-bg{background:#eee;border-radius:10px;height:14px;overflow:hidden;}
  .progress-bar-fill{background:linear-gradient(90deg,#2563eb,#22c55e);height:100%;transition:width .4s;}
  #itemList{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-bottom:16px;}
  .item{
    background:#fff;border-radius:16px;padding:20px 18px 16px;margin-bottom:0;
    box-shadow:0 6px 18px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:8px;
    position:relative;border-top:4px solid var(--accent);transition:transform .2s,box-shadow .2s;
  }
  .item:hover{transform:translateY(-3px);box-shadow:0 12px 24px rgba(0,0,0,.18);}
  .item.done{opacity:.7;border-top-color:#22c55e;}
  .item.dragging{opacity:.4;}
  .item.drag-over{outline:3px dashed var(--accent);outline-offset:2px;}
  .drag-handle{position:absolute;top:14px;left:14px;width:26px;height:26px;display:flex;align-items:center;justify-content:center;background:#f3f4f6;border-radius:8px;color:#888;font-size:16px;cursor:grab;user-select:none;}
  .drag-handle:active{cursor:grabbing;}
  .item{padding-left:46px;}
  .item .check-wrap{position:absolute;top:16px;right:16px;padding-top:0;}
  .check-wrap input{width:22px;height:22px;cursor:pointer;}
  .item-body{flex:1;padding-right:30px;}
  .item-title{font-weight:700;color:#222;margin-bottom:10px;font-size:16px;}
  .fields{display:flex;flex-direction:column;flex-wrap:wrap;gap:8px;}
  .field{display:flex;align-items:center;gap:6px;font-size:13px;color:#555;}
  .field select,.field input{padding:4px 8px;border:1px solid #ddd;border-radius:8px;font-size:13px;}
  .field .value-text{padding:4px 8px;background:#f3f4f6;border-radius:8px;min-width:60px;display:inline-block;}
  .item-actions{display:flex;flex-direction:row;justify-content:flex-end;gap:6px;margin-top:4px;}
  .del-btn{background:#fee2e2;color:#b91c1c;border:none;border-radius:8px;padding:6px 10px;font-size:12px;cursor:pointer;}
  .add-item-btn{
    width:100%;padding:14px;border-radius:14px;border:2px dashed rgba(255,255,255,.6);
    background:transparent;color:#fff;font-size:15px;cursor:pointer;margin-top:8px;
  }
  .modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:16px;padding:28px;width:90%;max-width:320px;text-align:center;}
  .modal input{width:100%;padding:10px;border-radius:8px;border:1px solid #ccc;margin:14px 0;font-size:14px;}
  .modal-buttons{display:flex;gap:10px;}
  .modal-buttons button{flex:1;padding:10px;border-radius:8px;border:none;cursor:pointer;font-size:14px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-secondary{background:#eee;color:#333;}
  .hidden{display:none !important;}
  .footer-note{text-align:center;color:rgba(255,255,255,.8);font-size:12px;margin-top:20px;}
  .admin-tools{display:flex;flex-direction:column;gap:8px;margin-top:8px;}
  .emp-row{display:flex;justify-content:space-between;align-items:center;padding:8px 4px;border-bottom:1px solid #eee;font-size:14px;}
  .emp-row span{color:#222;}
  .emp-row button{background:#fee2e2;color:#b91c1c;border:none;border-radius:6px;padding:5px 10px;font-size:12px;cursor:pointer;}
  .emp-add-row{display:flex;gap:8px;margin:14px 0;}
  .emp-add-row input{flex:1;margin:0;}
  .emp-add-row button{flex:none;padding:0 16px;border-radius:8px;border:none;cursor:pointer;background:var(--accent);color:#fff;font-size:14px;}
  .employee-filter-card{background:#fff;border-radius:16px;padding:18px 20px;margin-bottom:20px;box-shadow:0 10px 30px rgba(0,0,0,.15);}
  .employee-filter-title{font-weight:700;color:#222;margin-bottom:12px;font-size:14px;}
  .employee-chip-list{display:flex;flex-wrap:wrap;gap:8px;}
  .employee-chip{background:#eef2ff;color:var(--blue1);border:none;border-radius:20px;padding:8px 16px;font-size:13px;cursor:pointer;font-weight:600;}
  .employee-chip:hover{background:#dbe4ff;}
  .employee-chip.active{background:var(--accent);color:#fff;}
  .employee-tasks-modal{max-width:520px;text-align:left;}
  .employee-tasks-modal h3{text-align:center;margin-top:0;}
  #employeeTasksList{max-height:420px;overflow-y:auto;margin:14px 0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .emp-task-card{background:#f8f9fc;border-radius:12px;padding:14px 14px 12px;border-top:4px solid var(--accent);box-shadow:0 4px 12px rgba(0,0,0,.08);display:flex;flex-direction:column;gap:8px;}
  .emp-task-card.done{opacity:.65;border-top-color:#22c55e;}
  .emp-task-card .task-title{color:#222;font-weight:600;font-size:14px;line-height:1.4;}
  .emp-task-card.done .task-title{text-decoration:line-through;color:#999;}
  .emp-task-card .task-role{align-self:flex-start;font-size:12px;color:#2563eb;background:#eef2ff;padding:3px 8px;border-radius:8px;white-space:nowrap;}
  .emp-task-empty{padding:20px 4px;color:#888;font-size:14px;text-align:center;grid-column:1/-1;}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <button class="admin-btn" id="adminBtn">관리자</button>
    <div class="logo">골프<span>프렌드</span></div>
    <div class="subtitle">송파점 업무분담 체크리스트</div>
  </div>

  <div class="progress-card">
    <div class="progress-top">
      <div class="progress-percent" id="percentText">0%</div>
      <div class="progress-date" id="dateText"></div>
    </div>
    <div class="progress-bar-bg"><div class="progress-bar-fill" id="progressFill" style="width:0%"></div></div>
  </div>

  <div class="employee-filter-card">
    <div class="employee-filter-title">담당자별 업무 보기</div>
    <div class="employee-chip-list" id="employeeChipList"></div>
  </div>

  <div id="itemList"></div>

  <button class="add-item-btn hidden" id="addItemBtn">+ 업무 항목 추가</button>

  <div class="admin-tools">
    <button class="add-item-btn hidden" id="manageEmployeesBtn">+ 담당자 관리</button>
    <button class="add-item-btn hidden" id="changePwBtn">🔒 관리자 비밀번호 변경</button>
  </div>

  <div class="footer-note">매일 자정(한국시간) 자동으로 체크 상태가 초기화됩니다</div>
</div>

<div class="modal-bg hidden" id="adminModal">
  <div class="modal">
    <h3>관리자 로그인</h3>
    <input type="password" id="adminPw" placeholder="관리자 비밀번호">
    <div class="modal-buttons">
      <button class="btn-secondary" id="adminCancel">취소</button>
      <button class="btn-primary" id="adminConfirm">확인</button>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="employeeModal">
  <div class="modal">
    <h3>담당자 관리</h3>
    <div id="employeeListWrap"></div>
    <div class="emp-add-row">
      <input type="text" id="newEmployeeName" placeholder="새 담당자 이름">
      <button id="addEmployeeBtn">추가</button>
    </div>
    <div class="modal-buttons">
      <button class="btn-secondary" id="employeeModalClose">닫기</button>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="pwModal">
  <div class="modal">
    <h3>관리자 비밀번호 변경</h3>
    <input type="password" id="pwCurrent" placeholder="현재 비밀번호">
    <input type="password" id="pwNew" placeholder="새 비밀번호">
    <input type="password" id="pwNewConfirm" placeholder="새 비밀번호 확인">
    <div class="modal-buttons">
      <button class="btn-secondary" id="pwCancel">취소</button>
      <button class="btn-primary" id="pwConfirm">변경</button>
    </div>
  </div>
</div>

<div class="modal-bg hidden" id="employeeTasksModal">
  <div class="modal employee-tasks-modal">
    <h3 id="employeeTasksTitle">담당 업무</h3>
    <div id="employeeTasksList"></div>
    <div class="modal-buttons">
      <button class="btn-secondary" id="employeeTasksClose">닫기</button>
    </div>
  </div>
</div>

<script>
const firebaseConfig = {
  apiKey: "AIzaSyBamcXYyvM6uA97bN1g4x5sHrCtaWbRgvM",
  authDomain: "golf-friend-songpa.firebaseapp.com",
  projectId: "golf-friend-songpa",
  storageBucket: "golf-friend-songpa.firebasestorage.app",
  messagingSenderId: "715360671320",
  appId: "1:715360671320:web:197c822839433854f19c2d"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const docRef = db.collection('songpa_checklist').doc('main');

const DEFAULT_ADMIN_PASSWORD = '940403';
const DEFAULT_EMPLOYEES = ['장근희','이준용','김송이','제갈지우','장은석'];

function getAdminPassword(){
  return (state && typeof state.adminPassword === 'string') ? state.adminPassword : DEFAULT_ADMIN_PASSWORD;
}
function getEmployees(){
  return (state && Array.isArray(state.employees)) ? state.employees : DEFAULT_EMPLOYEES;
}

function mkItem(id, title, labels){
  return {id, title, fields: labels.map(function(l){return {label:l, value:''};}), done:false};
}

function defaultItems(){
  return [
    mkItem('fitting','피팅',['정','부1','부2']),
    mkItem('logistics','물류 (확보・쇼핑몰・지점간 이동)',['정','부1','부2']),
    mkItem('blog','블로그 (키워드 관리・상단노출 최신화)',['정','부1','부2']),
    mkItem('phone','전화 안내',['정','부1','부2']),
    mkItem('clean_toilet','마감 청소 - 화장실',['정','부1','부2']),
    mkItem('clean_b1','마감 청소 - 지하 1층',['정','부1','부2']),
    mkItem('clean_1f','마감 청소 - 1층',['정','부1','부2']),
    mkItem('clean_dust','마감 청소 - 화요일・금요일 먼지 청소',['정','부1','부2']),
    mkItem('order_club','재고 확보 및 발주 (19:00~20:00) - 클럽 발주',['정','부1','부2']),
    mkItem('order_goods','재고 확보 및 발주 (19:00~20:00) - 용품 발주',['정','부1','부2']),
    mkItem('ecount','이카운트 / 구글 마감',['정','부1','부2']),
    mkItem('hq','기타 본사 업무 및 수습 인원 교육',['정','부1','부2']),
    mkItem('inventory','월말 재고 조사',['정','부1','부2'])
  ];
}

function migrateTwoPersonFields(items){
  let changed = false;
  const migrated = items.map(function(it){
    if(it.fields.length === 2 && it.fields[0].label === '정' && it.fields[1].label === '부'){
      changed = true;
      return Object.assign({}, it, {
        fields: [
          {label:'정', value: it.fields[0].value},
          {label:'부1', value: it.fields[1].value},
          {label:'부2', value: ''}
        ]
      });
    }
    return it;
  });
  return {changed: changed, items: migrated};
}

function todayKST(){
  return new Date().toLocaleDateString('sv-SE', {timeZone:'Asia/Seoul'});
}

let state = null;
let isAdmin = sessionStorage.getItem('isAdmin') === 'true';
let employeeFilter = null;

const itemListEl = document.getElementById('itemList');
const percentText = document.getElementById('percentText');
const progressFill = document.getElementById('progressFill');
const dateText = document.getElementById('dateText');
const adminBtn = document.getElementById('adminBtn');
const addItemBtn = document.getElementById('addItemBtn');
const adminModal = document.getElementById('adminModal');
const adminPw = document.getElementById('adminPw');
const manageEmployeesBtn = document.getElementById('manageEmployeesBtn');
const changePwBtn = document.getElementById('changePwBtn');
const employeeModal = document.getElementById('employeeModal');
const employeeListWrap = document.getElementById('employeeListWrap');
const newEmployeeName = document.getElementById('newEmployeeName');
const addEmployeeBtn = document.getElementById('addEmployeeBtn');
const pwModal = document.getElementById('pwModal');
const pwCurrent = document.getElementById('pwCurrent');
const pwNew = document.getElementById('pwNew');
const pwNewConfirm = document.getElementById('pwNewConfirm');
const employeeChipList = document.getElementById('employeeChipList');
const employeeTasksModal = document.getElementById('employeeTasksModal');
const employeeTasksTitle = document.getElementById('employeeTasksTitle');
const employeeTasksList = document.getElementById('employeeTasksList');

function updateAdminUI(){
  adminBtn.textContent = isAdmin ? '관리자 모드 종료' : '관리자';
  adminBtn.classList.toggle('active', isAdmin);
  addItemBtn.classList.toggle('hidden', !isAdmin);
  manageEmployeesBtn.classList.toggle('hidden', !isAdmin);
  changePwBtn.classList.toggle('hidden', !isAdmin);
  render();
}

adminBtn.addEventListener('click', function(){
  if(isAdmin){
    isAdmin = false;
    sessionStorage.removeItem('isAdmin');
    updateAdminUI();
  } else {
    adminPw.value='';
    adminModal.classList.remove('hidden');
    adminPw.focus();
  }
});

document.getElementById('adminCancel').addEventListener('click', function(){
  adminModal.classList.add('hidden');
});

document.getElementById('adminConfirm').addEventListener('click', tryAdminLogin);
adminPw.addEventListener('keydown', function(e){ if(e.key==='Enter') tryAdminLogin(); });

function tryAdminLogin(){
  if(adminPw.value === getAdminPassword()){
    isAdmin = true;
    sessionStorage.setItem('isAdmin','true');
    adminModal.classList.add('hidden');
    updateAdminUI();
  } else {
    alert('비밀번호가 올바르지 않습니다.');
  }
}

function renderEmployeeList(){
  employeeListWrap.innerHTML = '';
  getEmployees().forEach(function(name){
    const row = document.createElement('div');
    row.className = 'emp-row';
    const span = document.createElement('span');
    span.textContent = name;
    row.appendChild(span);
    const delBtn = document.createElement('button');
    delBtn.textContent = '삭제';
    delBtn.addEventListener('click', function(){
      if(!confirm(name + ' 님을 담당자 목록에서 삭제할까요?')) return;
      const updated = getEmployees().filter(function(n){ return n !== name; });
      docRef.update({employees: updated}).then(renderEmployeeList);
    });
    row.appendChild(delBtn);
    employeeListWrap.appendChild(row);
  });
}

manageEmployeesBtn.addEventListener('click', function(){
  renderEmployeeList();
  employeeModal.classList.remove('hidden');
});

document.getElementById('employeeModalClose').addEventListener('click', function(){
  employeeModal.classList.add('hidden');
});

function renderEmployeeChips(){
  employeeChipList.innerHTML = '';
  const allChip = document.createElement('button');
  allChip.className = 'employee-chip' + (employeeFilter ? '' : ' active');
  allChip.textContent = '전체';
  allChip.addEventListener('click', function(){
    if(employeeFilter === null) return;
    employeeFilter = null;
    render();
  });
  employeeChipList.appendChild(allChip);
  getEmployees().forEach(function(name){
    const chip = document.createElement('button');
    chip.className = 'employee-chip' + (employeeFilter === name ? ' active' : '');
    chip.textContent = name;
    chip.addEventListener('click', function(){
      employeeFilter = (employeeFilter === name) ? null : name;
      render();
    });
    employeeChipList.appendChild(chip);
  });
}

function showEmployeeTasks(name){
  if(!state) return;
  employeeTasksTitle.textContent = name + '님의 담당 업무';
  employeeTasksList.innerHTML = '';
  const matched = state.items.filter(function(it){
    return it.fields.some(function(f){ return f.value === name; });
  });
  if(matched.length === 0){
    const empty = document.createElement('div');
    empty.className = 'emp-task-empty';
    empty.textContent = '담당하고 있는 업무가 없습니다.';
    employeeTasksList.appendChild(empty);
  } else {
    matched.forEach(function(it){
      const roles = it.fields
        .filter(function(f){ return f.value === name; })
        .map(function(f){ return f.label; })
        .join(', ');
      const row = document.createElement('div');
      row.className = 'emp-task-card' + (it.done ? ' done' : '');
      const titleSpan = document.createElement('span');
      titleSpan.className = 'task-title';
      titleSpan.textContent = it.title;
      const roleSpan = document.createElement('span');
      roleSpan.className = 'task-role';
      roleSpan.textContent = roles;
      row.appendChild(titleSpan);
      row.appendChild(roleSpan);
      employeeTasksList.appendChild(row);
    });
  }
  employeeTasksModal.classList.remove('hidden');
}

document.getElementById('employeeTasksClose').addEventListener('click', function(){
  employeeTasksModal.classList.add('hidden');
});

addEmployeeBtn.addEventListener('click', function(){
  const name = newEmployeeName.value.trim();
  if(!name) return;
  const current = getEmployees();
  if(current.indexOf(name) !== -1){
    alert('이미 등록된 이름입니다.');
    return;
  }
  const updated = current.concat([name]);
  docRef.update({employees: updated}).then(function(){
    newEmployeeName.value = '';
    renderEmployeeList();
  });
});
newEmployeeName.addEventListener('keydown', function(e){ if(e.key === 'Enter') addEmployeeBtn.click(); });

changePwBtn.addEventListener('click', function(){
  pwCurrent.value = ''; pwNew.value = ''; pwNewConfirm.value = '';
  pwModal.classList.remove('hidden');
  pwCurrent.focus();
});

document.getElementById('pwCancel').addEventListener('click', function(){
  pwModal.classList.add('hidden');
});

document.getElementById('pwConfirm').addEventListener('click', function(){
  if(pwCurrent.value !== getAdminPassword()){
    alert('현재 비밀번호가 올바르지 않습니다.');
    return;
  }
  if(!pwNew.value || pwNew.value.length < 4){
    alert('새 비밀번호는 4자 이상이어야 합니다.');
    return;
  }
  if(pwNew.value !== pwNewConfirm.value){
    alert('새 비밀번호가 서로 일치하지 않습니다.');
    return;
  }
  docRef.update({adminPassword: pwNew.value}).then(function(){
    alert('비밀번호가 변경되었습니다.');
    pwModal.classList.add('hidden');
  });
});

addItemBtn.addEventListener('click', function(){
  const title = prompt('추가할 업무 이름을 입력하세요');
  if(!title) return;
  const useSingle = confirm('담당자가 1명인 업무인가요?\n확인=1명 담당 / 취소=정,부1,부2 3명');
  const labels = useSingle ? ['담당'] : ['정','부1','부2'];
  const newItem = mkItem('item_'+Date.now(), title, labels);
  const items = state.items.concat([newItem]);
  docRef.update({items: items});
});

function ensureDoc(){
  return docRef.get().then(function(snap){
    if(!snap.exists){
      return docRef.set({
        items: defaultItems(),
        resetDate: todayKST(),
        adminPassword: DEFAULT_ADMIN_PASSWORD,
        employees: DEFAULT_EMPLOYEES.slice()
      });
    }
    const data = snap.data();
    const patch = {};
    if(typeof data.adminPassword !== 'string') patch.adminPassword = DEFAULT_ADMIN_PASSWORD;
    if(!Array.isArray(data.employees)) patch.employees = DEFAULT_EMPLOYEES.slice();
    if(Array.isArray(data.items)){
      const migration = migrateTwoPersonFields(data.items);
      if(migration.changed) patch.items = migration.items;
    }
    if(Object.keys(patch).length) return docRef.update(patch);
  });
}

function checkDailyReset(data){
  const today = todayKST();
  if(data.resetDate !== today){
    const resetItems = data.items.map(function(it){
      const copy = Object.assign({}, it);
      copy.done = false;
      return copy;
    });
    return docRef.update({items: resetItems, resetDate: today});
  }
}

function render(){
  if(!state) return;
  renderEmployeeChips();
  dateText.textContent = state.resetDate + ' 기준';
  const total = state.items.length;
  const doneCount = state.items.filter(function(i){return i.done;}).length;
  const percent = total===0 ? 0 : Math.round((doneCount/total)*100);
  percentText.textContent = percent + '%';
  progressFill.style.width = percent + '%';

  const __oldRects = {};
  itemListEl.querySelectorAll('.item').forEach(function(el){
    if(el.dataset.itemId) __oldRects[el.dataset.itemId] = el.getBoundingClientRect();
  });

  itemListEl.innerHTML = '';
  let __visibleCount = 0;
  state.items.forEach(function(item, idx){
    if(employeeFilter && !item.fields.some(function(f){ return f.value === employeeFilter; })) return;
    __visibleCount++;
    const div = document.createElement('div');
    div.className = 'item' + (item.done ? ' done' : '');
    div.dataset.itemId = item.id;

    if(isAdmin && !employeeFilter){
      const dragHandle = document.createElement('div');
      dragHandle.className = 'drag-handle';
      dragHandle.textContent = '\u2261';
      dragHandle.title = '\uB4dc\uB798\uadf8\ud574\uc11c \uc21c\uc11c \ubcc0\uacbd';
      dragHandle.draggable = true;
      dragHandle.addEventListener('dragstart', function(e){
        e.dataTransfer.setData('text/plain', String(idx));
        div.classList.add('dragging');
      });
      dragHandle.addEventListener('dragend', function(){
        div.classList.remove('dragging');
      });
      div.appendChild(dragHandle);

      div.addEventListener('dragover', function(e){
        e.preventDefault();
        div.classList.add('drag-over');
      });
      div.addEventListener('dragleave', function(){
        div.classList.remove('drag-over');
      });
      div.addEventListener('drop', function(e){
        e.preventDefault();
        div.classList.remove('drag-over');
        const fromIdx = parseInt(e.dataTransfer.getData('text/plain'), 10);
        const toIdx = idx;
        if(isNaN(fromIdx) || fromIdx === toIdx) return;
        const newItems = state.items.slice();
        const moved = newItems.splice(fromIdx, 1)[0];
        newItems.splice(toIdx, 0, moved);
        docRef.update({items: newItems});
      });
    }

    const checkWrap = document.createElement('div');
    checkWrap.className = 'check-wrap';
    const checkbox = document.createElement('input');
    checkbox.type = 'checkbox';
    checkbox.checked = item.done;
    checkbox.addEventListener('change', function(){
      const items = state.items.map(function(it,i){
        if(i!==idx) return it;
        const copy = Object.assign({}, it);
        copy.done = checkbox.checked;
        return copy;
      });
      docRef.update({items: items});
    });
    checkWrap.appendChild(checkbox);

    const body = document.createElement('div');
    body.className = 'item-body';

    const titleEl = document.createElement('div');
    titleEl.className = 'item-title';
    if(isAdmin){
      const titleInput = document.createElement('input');
      titleInput.value = item.title;
      titleInput.style.cssText='font-weight:700;border:1px solid #ddd;border-radius:8px;padding:4px 8px;width:100%;';
      titleInput.addEventListener('change', function(){
        const items = state.items.map(function(it,i){
          if(i!==idx) return it;
          const copy = Object.assign({}, it);
          copy.title = titleInput.value;
          return copy;
        });
        docRef.update({items: items});
      });
      titleEl.appendChild(titleInput);
    } else {
      titleEl.textContent = item.title;
    }
    body.appendChild(titleEl);

    const fieldsEl = document.createElement('div');
    fieldsEl.className = 'fields';
    item.fields.forEach(function(f, fIdx){
      const fieldEl = document.createElement('div');
      fieldEl.className = 'field';
      const label = document.createElement('span');
      label.textContent = f.label + ':';
      fieldEl.appendChild(label);

      if(isAdmin){
        const select = document.createElement('select');
        const emptyOpt = document.createElement('option');
        emptyOpt.value=''; emptyOpt.textContent='-';
        select.appendChild(emptyOpt);
        getEmployees().forEach(function(name){
          const opt = document.createElement('option');
          opt.value=name; opt.textContent=name;
          if(f.value===name) opt.selected=true;
          select.appendChild(opt);
        });
        select.addEventListener('change', function(){
          const items = state.items.map(function(it,i){
            if(i!==idx) return it;
            const fields = it.fields.map(function(ff,fi){
              if(fi!==fIdx) return ff;
              const c = Object.assign({}, ff);
              c.value = select.value;
              return c;
            });
            const copy = Object.assign({}, it);
            copy.fields = fields;
            return copy;
          });
          docRef.update({items: items});
        });
        fieldEl.appendChild(select);
      } else {
        const valEl = document.createElement('span');
        valEl.className='value-text';
        valEl.textContent = f.value || '-';
        fieldEl.appendChild(valEl);
      }
      fieldsEl.appendChild(fieldEl);
    });
    body.appendChild(fieldsEl);

    div.appendChild(checkWrap);
    div.appendChild(body);

    if(isAdmin){
      const actions = document.createElement('div');
      actions.className='item-actions';
      const delBtn = document.createElement('button');
      delBtn.className='del-btn';
      delBtn.textContent='삭제';
      delBtn.addEventListener('click', function(){
        if(!confirm('이 항목을 삭제할까요?')) return;
        const items = state.items.filter(function(it,i){return i!==idx;});
        docRef.update({items: items});
      });
      actions.appendChild(delBtn);
      div.appendChild(actions);
    }

    itemListEl.appendChild(div);
  });

  if(employeeFilter && __visibleCount === 0){
    const empty = document.createElement('div');
    empty.className = 'item';
    empty.style.cssText = 'align-items:center;justify-content:center;text-align:center;color:#888;';
    empty.textContent = employeeFilter + '님이 담당하고 있는 업무가 없습니다.';
    itemListEl.appendChild(empty);
  }

  itemListEl.querySelectorAll('.item').forEach(function(el){
    const id = el.dataset.itemId;
    const oldRect = __oldRects[id];
    if(!oldRect) return;
    const newRect = el.getBoundingClientRect();
    const dx = oldRect.left - newRect.left;
    const dy = oldRect.top - newRect.top;
    if(dx || dy){
      el.style.transition = 'none';
      el.style.transform = 'translate(' + dx + 'px,' + dy + 'px)';
      requestAnimationFrame(function(){
        el.style.transition = 'transform 0.3s ease';
        el.style.transform = '';
      });
    }
  });
}

ensureDoc().then(function(){
  docRef.onSnapshot(function(snap){
    if(!snap.exists) return;
    const data = snap.data();
    state = data;
    checkDailyReset(data);
    render();
  });
  updateAdminUI();
});

setInterval(function(){
  docRef.get().then(function(snap){
    if(snap.exists) checkDailyReset(snap.data());
  });
}, 60000);
</script>
</body>
</html>
